name: Website quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Full audit or performance measurement only
        type: choice
        options: [full, performance]
        default: full
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 .github/quality/image_catalog.py --check
      - run: python3 .github/quality/static.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: static-audit
          path: .github/quality/results
  browser:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      FULL_AUDIT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
          git cat-file -e "$BASE" || git fetch --depth=1 origin "$BASE"
          git worktree add ../baseline "$BASE"
        if: github.event.before != '0000000000000000000000000000000000000000'
      - run: git worktree add ../baseline HEAD^
        if: github.event.before == '0000000000000000000000000000000000000000'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: .github/quality/package-lock.json
      - run: npm install --global npm@11.11.0
      - run: npm ci
        working-directory: .github/quality
      - run: npx playwright install --with-deps chromium
        if: github.event.inputs.scope != 'performance'
        timeout-minutes: 5
        working-directory: .github/quality
      - run: ./node_modules/.bin/playwright test
        if: github.event.inputs.scope != 'performance'
        working-directory: .github/quality
      - run: ./node_modules/.bin/lhci collect && ./node_modules/.bin/lhci upload
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
        working-directory: .github/quality
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-and-lighthouse
          path: .github/quality/results
          retention-days: 14
